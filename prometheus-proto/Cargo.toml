[package]
name = "measured-prometheus-protobuf"
version = "0.1.0"
edition = "2021"
description = "Prometheus protobuf exposition format for measured"
authors = ["Conrad Ludgate <conradludgate@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/conradludgate/measured"
readme = "README.md"
rust-version = "1.98"

[dependencies]
measured = { path = "../core", version = "0.1.0" }
bytes = "1"
zmij = "1"

[dev-dependencies]
prost = "0.12"
prost-types = "0.12"
measured = { path = "../core", version = "0.1.0", features = ["lasso"] }
divan = "0.1.14"
prometheus = { version = "0.14.0", default-features = false, features = ["protobuf"] }
prometheus-client = { version = "0.24.0", features = ["protobuf"] }
ahash = "0.8"

[[bench]]
name = "encoding"
harness = false
