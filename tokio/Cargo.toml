[package]
name = "measured-tokio"
version = "0.1.1"
edition = "2024"
description = "Tokio metrics for measured"
authors = ["Conrad Ludgate <conradludgate@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/conradludgate/measured"
readme = "README.md"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
net = ["tokio/net"]
# Requires `--cfg tokio_unstable`. Not covered by semver.
__tokio-unstable-schedule-latency = ["tokio/schedule-latency"]

[dependencies]
measured = { path = "../core", version = "0.1.1" }
tokio = { version = "1.53.0", features = ["rt"] }

[dev-dependencies]
measured-prometheus-text = { path = "../prometheus-text" }
measured-prometheus-protobuf = { path = "../prometheus-proto" }
prost = "0.12"
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "macros"] }

[package.metadata.docs.rs]
features = ["net"]
rustdoc-args = ["--cfg=tokio_unstable"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
